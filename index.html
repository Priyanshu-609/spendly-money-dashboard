<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3fbfa" />
    <meta name="description" content="Spendly makes it easier to understand your spending, plan a budget, and stay on track with your savings goals." />
    <meta property="og:title" content="Spendly — your money, in focus" />
    <meta property="og:description" content="A responsive personal finance dashboard for monthly spending, category budgets, and savings goals." />
    <meta property="og:type" content="website" />
    <title>Spendly — your money, in focus</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-scrim" id="sidebar-scrim"></div>
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" id="brand-link" href="#dashboard" aria-label="Spendly dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none"><path d="M9 35C9 19.2 22.7 8 40 7c-1.2 16.1-9.5 29-25.4 31.8" fill="currentColor" opacity=".9"/><path d="M6 41c8.7-8.7 16.4-16.3 27-26" stroke="#0D7565" stroke-width="2.4" stroke-linecap="round"/><path d="M10 31c-4.7-6.2-4.5-13.5 1.1-19.4 6.2 4.1 8.3 10.4 5.2 17.2M22 22c.3-7.4 4.7-12.9 12.6-14.8 2.3 7.1.3 13.5-6.1 18" fill="currentColor" opacity=".55"/></svg>
          </span>
          <span class="brand-copy"><strong>Spendly</strong><small>Track today<br />Build a better tomorrow</small></span>
        </a>

        <nav class="nav-list" id="navigation">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="dashboard"></span>Dashboard</button>
          <button class="nav-item" data-view="transactions"><span class="nav-icon" data-icon="transactions"></span>Transactions</button>
          <button class="nav-item" data-view="budget"><span class="nav-icon" data-icon="budget"></span>Budget</button>
          <button class="nav-item" data-view="goals"><span class="nav-icon" data-icon="goals"></span>Goals</button>
          <button class="nav-item" data-view="analytics"><span class="nav-icon" data-icon="analytics"></span>Analytics</button>
          <button class="nav-item" data-view="categories"><span class="nav-icon" data-icon="categories"></span>Categories</button>
          <button class="nav-item" data-view="reports"><span class="nav-icon" data-icon="reports"></span>Reports</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button>
        </nav>

        <div class="sidebar-promo">
          <div class="promo-plant" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
          <p>Small steps.<br />Big freedom.</p>
          <button class="button button-primary button-wide" data-action="add-transaction">Keep going <span>→</span></button>
        </div>
        <div class="sidebar-foot"><span class="online-dot"></span> Your money stays on this device</div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation"><span data-icon="menu"></span></button>
          <label class="search-box"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Search transactions, categories, or goals…" autocomplete="off" /></label>
          <div class="topbar-actions">
            <button class="icon-button notification-button" aria-label="Notifications"><span data-icon="bell"></span><i></i></button>
            <button class="profile-button" id="profile-button" aria-label="Edit your profile"><span class="avatar">P</span><span><strong id="profile-name">Priyanshu</strong><small>Keep going! ✨</small></span><span class="chevron" data-icon="chevron"></span></button>
          </div>
        </header>

        <div id="view" class="view-root"></div>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <dialog class="modal" id="transaction-modal" aria-labelledby="transaction-title">
      <form id="transaction-form" method="dialog">
        <div class="modal-heading"><div><span class="eyebrow">KEEP YOUR NUMBERS CURRENT</span><h2 id="transaction-title">Add transaction</h2></div><button class="icon-button close-modal" type="button" aria-label="Close">×</button></div>
        <div class="type-switch" role="group" aria-label="Transaction type"><button type="button" data-type="expense" class="selected">Expense</button><button type="button" data-type="income">Income</button><button type="button" data-type="transfer">Transfer</button></div>
        <input type="hidden" name="type" value="expense" />
        <label class="field-label">Description<input name="description" required maxlength="60" placeholder="e.g. Groceries" /></label>
        <div class="form-row"><label class="field-label">Amount<input name="amount" required type="number" min="1" step="1" inputmode="decimal" placeholder="0" /></label><label class="field-label">Category<select name="category" id="transaction-category"></select></label></div>
        <label class="field-label">Date<input name="date" required type="date" /></label>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-modal>Cancel</button><button class="button button-primary" type="submit">Save transaction <span>→</span></button></div>
      </form>
    </dialog>

    <dialog class="modal" id="goal-modal" aria-labelledby="goal-title">
      <form id="goal-form" method="dialog">
        <div class="modal-heading"><div><span class="eyebrow">MAKE ROOM FOR WHAT MATTERS</span><h2 id="goal-title">Create a savings goal</h2></div><button class="icon-button close-modal" type="button" aria-label="Close">×</button></div>
        <label class="field-label">What are you saving for?<input name="name" required maxlength="40" placeholder="e.g. A new laptop" /></label>
        <div class="form-row"><label class="field-label">Target amount<input name="target" required type="number" min="1" step="1" placeholder="80000" /></label><label class="field-label">Already saved<input name="saved" type="number" min="0" step="1" value="0" /></label></div>
        <label class="field-label">Monthly contribution<input name="contribution" required type="number" min="1" step="1" placeholder="5000" /></label>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-modal>Cancel</button><button class="button button-primary" type="submit">Create goal <span>→</span></button></div>
      </form>
    </dialog>

    <dialog class="modal" id="profile-modal" aria-labelledby="profile-title">
      <form id="profile-form" method="dialog">
        <div class="modal-heading"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="profile-title">Your preferences</h2></div><button class="icon-button close-modal" type="button" aria-label="Close">×</button></div>
        <label class="field-label">Your name<input name="name" required maxlength="30" /></label>
        <label class="field-label">Currency<select name="currency"><option value="INR">Indian Rupee (₹)</option><option value="USD">US Dollar ($)</option><option value="EUR">Euro (€)</option><option value="GBP">British Pound (£)</option></select></label>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-modal>Cancel</button><button class="button button-primary" type="submit">Save preferences <span>→</span></button></div>
      </form>
    </dialog>
  </body>
</html>
